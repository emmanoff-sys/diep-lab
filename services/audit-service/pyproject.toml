[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "audit-service"
version = "0.1.0"
description = "DAEP / RE-OS Audit Service — Immutable Platform Audit Log (WP-005-04)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic-settings>=2.3.0",
    "pydantic[email]>=2.7.0",
    # Shared platform libraries (EPIC-002)
    "reos-config>=0.1.0",
    "reos-logging>=0.1.0",
    "reos-exceptions>=0.1.0",
    "reos-common>=0.1.0",
    # Database
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
    "asyncpg>=0.29.0",
    # Auth / crypto
    "python-jose[cryptography]>=3.3.0",
    "cryptography>=42.0.0",
    # HTTP (JWKS fetch, Vault)
    "httpx>=0.27.0",
    # Kafka
    "aiokafka>=0.10.0",
    # Observability
    "structlog>=24.1.0",
    "prometheus-client>=0.20.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "testcontainers[postgres,kafka]>=4.7.0",
    "httpx>=0.27.0",
    "mypy>=1.10.0",
    "ruff>=0.4.0",
    "black>=24.0.0",
    "isort>=5.13.0",
    "bandit[toml]>=1.7.9",
    "types-python-jose>=3.3.4",
    "sqlalchemy[mypy]>=2.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/audit_service"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.isort]
profile = "black"
line_length = 100

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "C90", "N", "UP", "B", "S"]
# S101: allow assert in tests. B008: FastAPI Depends()/Query() in argument defaults is the framework pattern.
ignore = ["S101", "B008"]

[tool.mypy]
strict = true
python_version = "3.11"
plugins = ["pydantic.mypy", "sqlalchemy.ext.mypy.plugin"]

[[tool.mypy.overrides]]
module = ["aiokafka.*", "jose.*", "testcontainers.*", "prometheus_client.*"]
ignore_missing_imports = true

[tool.bandit]
skips = ["B101"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
