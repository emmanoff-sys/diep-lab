[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "identity-service"
version = "0.1.0"
description = "DAEP / RE-OS Identity Service — OAuth2 PKCE + RS256 JWT + RBAC (WP-005-01)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic-settings>=2.3.0",
    # Shared platform libraries (EPIC-002)
    "reos-config>=0.1.0",
    "reos-logging>=0.1.0",
    "reos-exceptions>=0.1.0",
    "reos-common>=0.1.0",
    # Database
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
    "asyncpg>=0.29.0",
    # Auth / crypto
    "argon2-cffi>=23.1.0",
    "python-jose[cryptography]>=3.3.0",
    "cryptography>=42.0.0",
    "python-multipart>=0.0.9",
    # MFA (WP-005-02 — SRS SEC-004)
    "pyotp>=2.9.0",
    "webauthn>=2.1.0",
    # Cache / session
    "redis[hiredis]>=5.0.0",
    # Vault
    "httpx>=0.27.0",
    # Kafka
    "aiokafka>=0.10.0",
    # Observability
    "structlog>=24.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "testcontainers[postgres,redis]>=4.7.0",
    "httpx>=0.27.0",
    "mypy>=1.10.0",
    "ruff>=0.4.0",
    "black>=24.0.0",
    "isort>=5.13.0",
    "bandit[toml]>=1.7.9",
    "types-python-jose>=3.3.4",
    "types-redis>=4.6.0",
    "sqlalchemy[mypy]>=2.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/identity_service"]

[tool.black]
line-length = 100
target-version = ["py311"]

# [tool.isort] intentionally absent: isort resolves the NEAREST config per
# file, so a section here shadows the root pyproject.toml and makes
# single-file and directory-walk invocations disagree on first-party
# classification (caused the PR #20-#22 Stage 1 chain). Root config governs.

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "C90", "N", "UP", "B", "S"]
# S101: allow assert in tests. B008: FastAPI Depends()/Query() in argument defaults is the framework pattern.
ignore = ["S101", "B008"]

[tool.mypy]
strict = true
python_version = "3.11"
plugins = ["pydantic.mypy", "sqlalchemy.ext.mypy.plugin"]

[[tool.mypy.overrides]]
module = ["aiokafka.*", "jose.*", "argon2.*", "testcontainers.*", "pyotp.*", "webauthn.*"]
ignore_missing_imports = true

[tool.bandit]
skips = ["B101"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
