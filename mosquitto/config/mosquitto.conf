# DIEP MQTT broker — authenticated.
# Global auth settings (apply to all listeners).
allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl

# Phase 9J-S4 — plaintext listeners RETIRED. The full platform (5 device verticals +
# ingestor + dispatcher) runs on mutual TLS only. Re-enable 1883 below only to migrate
# a new legacy client, then disable again.
# listener 1883
# listener 9001
# protocol websockets

# Phase 9J (S3+S4) — TLS + mutual-TLS listener: the ONLY listener now.
listener 8883
cafile /mosquitto/config/certs/ca.crt
certfile /mosquitto/config/certs/server.crt
keyfile /mosquitto/config/certs/server.key
# S4: require a client cert signed by the CA, and use its CN as the MQTT identity
# (so ACLs bind to the cert, not a shared password).
require_certificate true
use_identity_as_username true
