# RE-OS Pre-Commit Hook Configuration
# Authority: LLD v2.0 §2.1 (Python toolchain), §2.7 (testing), STANDARDS.md §8
# Version:   skeleton-v0.1 | WP-001-02
#
# This file establishes the pre-commit framework skeleton. Individual hooks are
# appended incrementally by later Work Packages:
#
#   WP-001-06 — Python: Black formatter, isort, Ruff linter, Mypy type-checker
#   WP-001-07 — Terraform: terraform fmt + tflint; Ansible: ansible-lint
#   WP-001-08 — Secrets detection (detect-secrets), dependency audit (pip-audit),
#               licence compliance check
#
# Install on a fresh clone:
#   pip install pre-commit
#   pre-commit install
#
# Run all hooks manually:
#   pre-commit run --all-files

minimum_pre_commit_version: "3.7.0"

default_language_version:
  python: python3.11

repos:
  # ── Python formatting (WP-001-06) ───────────────────────────────────────────
  - repo: https://github.com/psf/black
    rev: 24.4.2
    hooks:
      - id: black
        language_version: python3.11
        args: ["--line-length=100"]

  - repo: https://github.com/PyCQA/isort
    rev: 5.13.2
    hooks:
      - id: isort
        args: ["--profile=black", "--line-length=100"]

  # ── Python static analysis (WP-001-07) ──────────────────────────────────────
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.4.9
    hooks:
      - id: ruff
        args: ["--fix"]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.10.0
    hooks:
      - id: mypy
        args: ["--strict", "--ignore-missing-imports"]
        additional_dependencies:
          - "pydantic>=2.0"
          - "sqlalchemy[mypy]>=2.0"

  - repo: https://github.com/PyCQA/bandit
    rev: 1.7.9
    hooks:
      - id: bandit
        args: ["-c", ".bandit", "-r"]
        files: ^(src|templates)/.*\.py$
