# Root mypy configuration — DAEP / RE-OS
# Authority: LLD v2.0 §2.1 (mypy row), §2.1.1 (Type Annotations — Mandatory)
# WP-001-07 | Enforcement: pre-commit + CI Stage 1 (WP-004-02)
#
# Applies when running: mypy <path> from the repository root.
# Individual services also carry these settings in their own pyproject.toml.

[mypy]
python_version = 3.11
strict = True
warn_unused_configs = True
show_error_codes = True
pretty = True

# Per LLD v2.0 §2.1.1:
# - No unjustified Any; every suppression must cite the mypy error code.
# - Use X | None (PEP 604); Optional[X] is prohibited.
# - Use built-in generics: list[T], dict[K, V], not List[T], Dict[K, V].
# - from __future__ import annotations required in every module.

# Third-party library overrides (stubs not available; ignore missing imports only)
[mypy-jose.*]
ignore_missing_imports = True

[mypy-testcontainers.*]
ignore_missing_imports = True

[mypy-alembic.*]
ignore_missing_imports = True

[mypy-structlog.*]
ignore_missing_imports = True
