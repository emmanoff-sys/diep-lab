services:

  solar:
    image: python:3.12

    container_name: diep-solar

    restart: unless-stopped

    working_dir: /app

    volumes:
      - ./simulator:/app

    environment:
      DEVICE_ID: INV001
      CAPACITY_KW: "10"
      PYTHONUNBUFFERED: "1"

    command: >
      sh -c "
      pip install paho-mqtt &&
      python solar_inverter.py
      "

networks:
  default:
    name: diep-lab_diep-net
    external: true
