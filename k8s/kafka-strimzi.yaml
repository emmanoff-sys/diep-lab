# Kafka HA via the Strimzi operator: 3 brokers, replication factor 3, min.insync.replicas 2
# -> the command bus survives one broker loss with no message loss. (Lab today: 1 broker RF=1.)
apiVersion: kafka.strimzi.io/v1beta2
kind: Kafka
metadata:
  name: diep-kafka
  namespace: diep
spec:
  kafka:
    replicas: 3
    listeners:
      - name: tls
        port: 9093
        type: internal
        tls: true
        authentication:
          type: scram-sha-512          # SASL_SSL (Phase 9J-S5)
    config:
      default.replication.factor: 3
      min.insync.replicas: 2
      offsets.topic.replication.factor: 3
      transaction.state.log.replication.factor: 3
    storage:
      type: persistent-claim
      size: 20Gi
      class: fast-ssd
    rack:
      topologyKey: topology.kubernetes.io/zone   # rack awareness across AZs
  zookeeper:
    replicas: 3
    storage:
      type: persistent-claim
      size: 10Gi
  entityOperator:
    topicOperator: {}
    userOperator: {}
---
# The command topic, replicated x3.
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaTopic
metadata:
  name: diep-commands
  namespace: diep
  labels: { strimzi.io/cluster: diep-kafka }
spec:
  partitions: 6
  replicas: 3
  config:
    min.insync.replicas: 2
