# DIEP secrets template (Phase 9J-S0). DO NOT commit real values.
# In production, generate these via sealed-secrets, External Secrets Operator, or Vault —
# never plain Secrets in git. Values here are placeholders.
apiVersion: v1
kind: Secret
metadata:
  name: diep-secrets
  namespace: diep
type: Opaque
stringData:
  DIEP_AUTH_ENFORCED: "1"
  DIEP_JWT_SECRET: "REPLACE-long-random"
  DIEP_SERVICE_TOKEN: "REPLACE-service-token"
  DIEP_OPERATOR_KEY: "REPLACE-operator-key"
  DIEP_ADMIN_KEY: "REPLACE-admin-key"
  DIEP_ADMIN_PASSWORD: "REPLACE"
  DIEP_OPERATOR_PASSWORD: "REPLACE"
  DIEP_VIEWER_PASSWORD: "REPLACE"
  DB_PASSWORD: "REPLACE-db-password"
---
apiVersion: v1
kind: Secret
metadata:
  name: diep-pg-credentials
  namespace: diep
type: kubernetes.io/basic-auth
stringData:
  username: diep
  password: "REPLACE-db-password"
---
apiVersion: v1
kind: Secret
metadata:
  name: diep-redis-credentials
  namespace: diep
type: Opaque
stringData:
  redis-password: "REPLACE-redis-password"
