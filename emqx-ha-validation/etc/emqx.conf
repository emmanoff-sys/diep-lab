## DIEP K5 — EMQX 5.8.6 cluster config (shared across all 3 nodes).
## Node-specific settings (node.name) are injected via EMQX_NODE__NAME env var.

node {
  cookie = "diep-emqx-ha-2026"
  data_dir = "/opt/emqx/data"
}

cluster {
  name = "diep-emqx-ha"
  discovery_strategy = static
  static {
    seeds = ["emqx@emqx-ha-1.local", "emqx@emqx-ha-2.local", "emqx@emqx-ha-3.local"]
  }
}

## --- MQTT global settings ---
## peer_cert_as_username = cn mirrors Mosquitto's use_identity_as_username true.
## Lives under mqtt {}, not under the listener, in EMQX 5.x.
mqtt {
  peer_cert_as_username = cn
}

## --- Listeners ---
## Disable plaintext TCP (mirror Mosquitto: 1883 retired after Phase 9J-S4).
listeners.tcp.default {
  enabled = false
}

## mTLS MQTT listener — equivalent to Mosquitto port 8883.
listeners.ssl.default {
  enabled = true
  bind = "0.0.0.0:8883"
  ssl_options {
    cacertfile = "/opt/emqx/certs/ca.crt"
    certfile   = "/opt/emqx/certs/server.crt"
    keyfile    = "/opt/emqx/certs/server.key"
    verify = verify_peer
    fail_if_no_peer_cert = true
  }
}

## Disable WS/WSS listeners (not used by DIEP).
listeners.ws.default {
  enabled = false
}
listeners.wss.default {
  enabled = false
}

## --- Authentication ---
## Empty chain = allow all at MQTT level. The TLS handshake with
## fail_if_no_peer_cert = true is the actual authentication gate:
## no valid DIEP-CA-signed client cert → TLS rejected before MQTT CONNECT.
authentication = []

## --- Authorization ---
## File-based ACL. no_match = deny mirrors Mosquitto's implicit deny-all.
## deny_action = disconnect is stricter than Mosquitto (which drops silently);
## this surfaces misconfigured clients immediately.
authorization {
  no_match = deny
  deny_action = disconnect
  sources = [
    {
      type   = file
      enable = true
      path   = "/opt/emqx/etc/acl.conf"
    }
  ]
}

## --- Dashboard ---
dashboard {
  listeners.http {
    bind = "0.0.0.0:18083"
  }
  default_username = "admin"
  default_password = "diep-emqx-admin-2026"
}

## --- Logging ---
log {
  console_handler {
    enable = true
    level  = info
  }
}
