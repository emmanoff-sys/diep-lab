%% DIEP K5 — EMQX authorization ACL (Erlang term format).
%% Migrated 1-to-1 from mosquitto/config/acl.
%% Username = cert CN (set by peer_cert_as_username = cn on the SSL listener).
%%
%% Topic layout:
%%   diep/<domain>/<deviceId>        — telemetry (3 levels)
%%   diep/<domain>/<deviceId>/cmd    — command   (4 levels)
%%   diep/<domain>/<deviceId>/ack    — ack       (4 levels)

%% ── Legacy identities (password-based, still in Mosquitto passwd/ACL) ────────
{allow, {user, "diep-nodered"}, subscribe, ["diep/+/+", "diep/+/+/ack"]}.
{allow, {user, "diep-nodered"}, publish,   ["diep/+/+/cmd"]}.

{allow, {user, "diep-device"},  subscribe, ["diep/+/+/cmd"]}.
{allow, {user, "diep-device"},  publish,   ["diep/+/+/ack", "diep/+/+"]}.

%% ── Per-device mTLS identities (cert CN = username) ─────────────────────────
%% Each device is scoped to its OWN topics only.

{allow, {user, "INV001"},   publish,   ["diep/solar/INV001",       "diep/solar/INV001/ack"]}.
{allow, {user, "INV001"},   subscribe, ["diep/solar/INV001/cmd"]}.

{allow, {user, "METER001"}, publish,   ["diep/smartmeter/METER001","diep/smartmeter/METER001/ack"]}.
{allow, {user, "METER001"}, subscribe, ["diep/smartmeter/METER001/cmd"]}.

{allow, {user, "BAT001"},   publish,   ["diep/battery/BAT001",     "diep/battery/BAT001/ack"]}.
{allow, {user, "BAT001"},   subscribe, ["diep/battery/BAT001/cmd"]}.

{allow, {user, "MG001"},    publish,   ["diep/microgrid/MG001",    "diep/microgrid/MG001/ack"]}.
{allow, {user, "MG001"},    subscribe, ["diep/microgrid/MG001/cmd"]}.

{allow, {user, "EV001"},    publish,   ["diep/charger/EV001",      "diep/charger/EV001/ack"]}.
{allow, {user, "EV001"},    subscribe, ["diep/charger/EV001/cmd"]}.

%% OCPP CSMS: charger-domain scope (manages multiple physical chargers).
{allow, {user, "csms"},     publish,   ["diep/charger/+",          "diep/charger/+/ack"]}.
{allow, {user, "csms"},     subscribe, ["diep/charger/+/cmd"]}.

%% ── Platform infra services ───────────────────────────────────────────────────
%% Ingestor: read-only, all telemetry topics (3-level wildcard excludes cmd/ack).
{allow, {user, "ingestor"},   subscribe, ["diep/+/+"]}.

%% Dispatcher: issues commands, reads acks.
{allow, {user, "dispatcher"}, subscribe, ["diep/+/+/ack"]}.
{allow, {user, "dispatcher"}, publish,   ["diep/+/+/cmd"]}.

%% ── Edge device CNs from the *900 series (Phase 9C-9G) ───────────────────────
{allow, {user, "INV900"},   publish,   ["diep/solar/INV900",       "diep/solar/INV900/ack"]}.
{allow, {user, "INV900"},   subscribe, ["diep/solar/INV900/cmd"]}.

{allow, {user, "MTR900"},   publish,   ["diep/smartmeter/MTR900",  "diep/smartmeter/MTR900/ack"]}.
{allow, {user, "MTR900"},   subscribe, ["diep/smartmeter/MTR900/cmd"]}.

{allow, {user, "BAT900"},   publish,   ["diep/battery/BAT900",     "diep/battery/BAT900/ack"]}.
{allow, {user, "BAT900"},   subscribe, ["diep/battery/BAT900/cmd"]}.

{allow, {user, "MGC900"},   publish,   ["diep/microgrid/MGC900",   "diep/microgrid/MGC900/ack"]}.
{allow, {user, "MGC900"},   subscribe, ["diep/microgrid/MGC900/cmd"]}.

%% ── Deny everything else ─────────────────────────────────────────────────────
{deny, all}.
