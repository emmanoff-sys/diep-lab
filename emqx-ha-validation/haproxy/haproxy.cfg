# DIEP K5 — HAProxy 2.8 L4 TCP passthrough for EMQX MQTT cluster.
# Mode: TCP (Layer 4). TLS terminates at EMQX nodes — HAProxy passes raw bytes.
# Client certs are verified by EMQX (verify_peer), not by HAProxy.

global
  log stdout format raw local0 info
  maxconn 4096

defaults
  mode tcp
  log global
  option tcplog
  timeout connect  5s
  timeout client  60s
  timeout server  60s

# ── MQTT/TLS frontend (exposed as port 8883 on emqx-ha-lb) ──────────────────
frontend mqtt_tls
  bind *:8883
  default_backend emqx_cluster

# ── EMQX cluster backend (leastconn = fewest active connections) ─────────────
backend emqx_cluster
  balance leastconn
  option tcp-check
  server emqx-ha-1 emqx-ha-1.local:8883 check inter 5s fall 3 rise 2
  server emqx-ha-2 emqx-ha-2.local:8883 check inter 5s fall 3 rise 2
  server emqx-ha-3 emqx-ha-3.local:8883 check inter 5s fall 3 rise 2

# ── Stats endpoint (accessible on port 8404) ─────────────────────────────────
frontend stats
  mode http
  bind *:8404
  stats enable
  stats uri /stats
  stats refresh 5s
  stats show-node
