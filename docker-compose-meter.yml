services:

  # Phase 9C — real Modbus smart-meter driver behind the edge agent. Runs the
  # Modbus-TCP meter simulator in-container and the edge agent that drives it,
  # publishing canonical meter telemetry to diep/smartmeter/MTR900. Swap host/port
  # to a field meter (and drop the sim) for a hardware deployment.
  meter-edge:
    image: python:3.12
    container_name: diep-meter-edge
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./drivers:/app
      - ./certs/devices:/certs:ro
    environment:
      MQTT_BROKER: diep-mqtt
      MQTT_PORT: "8883"           # 9J-S4: per-device mTLS
      MQTT_TLS: "1"
      MQTT_CA_CERTS: /certs/ca.crt
      MQTT_CLIENT_CERT: /certs/METER001.crt
      MQTT_CLIENT_KEY: /certs/METER001.key
      MQTT_USER: ""
      MQTT_PASS: ""
      PYTHONUNBUFFERED: "1"
    command: >
      sh -c "
      pip install -q paho-mqtt;
      python -m modbus_meter.sim --host 127.0.0.1 --port 1602 --base-load 3.5 --swing 1.5 --period 60 &
      sleep 3;
      exec python edge_agent.py --config modbus_meter/devices.json
      "
    networks:
      - diep-net

networks:
  diep-net:
    name: diep-lab_diep-net
    external: true
