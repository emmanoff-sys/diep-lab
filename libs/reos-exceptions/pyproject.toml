[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "reos-exceptions"
version = "0.1.0"
description = "DAEP / RE-OS shared exception hierarchy and RFC 7807 handler — LLD v2.0 §2.2 (WP-002-05)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "reos-logging>=0.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "mypy>=1.10.0",
    "ruff>=0.4.0",
    "black>=24.0.0",
    "bandit[toml]>=1.7.9",
]

[tool.hatch.build.targets.wheel]
packages = ["src/reos_exceptions"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "C90", "N", "UP", "B", "S"]
ignore = ["S101"]

[tool.mypy]
strict = true
python_version = "3.11"

[tool.bandit]
skips = ["B101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
