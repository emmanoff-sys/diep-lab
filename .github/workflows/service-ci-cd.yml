name: RE-OS Service CI/CD

# DAEP / RE-OS — platform-wide service CI/CD pipeline (EPIC-004)
# Authority: Roadmap v1.0 §11.1 (14-stage pipeline) | LLD v2.0 Ch. 18
#
# This workflow is distinct from ci.yml (the live DIEP platform workflow) and
# from infra-checks.yml (infrastructure change checks, WP-003-11). It covers
# every RE-OS Python service built from the WP-001-05 scaffold, running the
# 14-stage pipeline defined in Roadmap v1.0 §11.1.
#
# NOTE: All "live" actions (GitHub branch-protection registration, real registry
# push, Staging/Production deployment) require Platform Lead / DevOps Lead
# execution — they are NOT triggered autonomously by this implementation (same
# governance principle as WP-003-11). See .github/README_EPIC004.md §Platform
# Lead Actions.

on:
  push:
    branches:
      - main
      - develop
      - "feature/**"
      - "fix/**"
      - "release/**"
    tags:
      - "v*"
  pull_request:
    branches:
      - main
      - develop

env:
  # LLD v2.0 Ch. 18 §env block — override per-service via repository variables.
  REGISTRY: registry.internal:5000
  SERVICE: ${{ github.event.repository.name }}
  PYTHON_VERSION: "3.11"   # pinned per LLD Ch. 18 §lint job

# ──────────────────────────────────────────────────────────────────────────────
# STAGE 1 — Lint & Type Check (Roadmap §11.1 Stage 1: <3 minutes, PR blocked)
# WP-004-01 | LLD v2.0 Ch. 18 §18.1 `lint` job (literal source)
# ──────────────────────────────────────────────────────────────────────────────
jobs:
  lint:
    name: Stage 1 — Lint & Type Check
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install lint tools
        run: pip install ruff black isort mypy

      - name: Ruff (lint + style)
        run: ruff check . --output-format github

      - name: Black (formatting)
        run: black --check --diff .

      - name: isort (import ordering)
        run: isort --check-only .

      - name: mypy (type checking)
        run: mypy src/ --strict

# ──────────────────────────────────────────────────────────────────────────────
# STAGE 2 — SAST Security (Roadmap §11.1 Stage 2: <5 minutes, No HIGH+, PR blocked)
# WP-004-02 | LLD v2.0 Ch. 18 §18.1 `security` job — SAST portion (literal source)
#
# CodeQL PLATFORM DEPENDENCY (WP-004-02 §24/§35): GitHub Advanced Security or
# a public repository is required for CodeQL. The Project Owner must confirm
# availability on this private repository. If unavailable, fall back to Bandit-
# only and raise a new ECR rather than silently dropping CodeQL.
# ──────────────────────────────────────────────────────────────────────────────
  security:
    name: Stage 2 — SAST Security
    runs-on: ubuntu-22.04
    timeout-minutes: 8
    permissions:
      actions: read
      contents: read
      security-events: write   # required for CodeQL to upload results
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install Bandit
        run: pip install bandit

      # LLD v2.0 Ch. 18 §security job — exact flags: -ll (medium+ confidence),
      # -ii (medium+ severity), JSON output for machine parsing.
      - name: Bandit SAST scan
        run: bandit -r src/ -ll -ii --format json -o bandit.json
        continue-on-error: false

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bandit-results
          path: bandit.json

      # CodeQL — deeper semantic analysis beyond Bandit's pattern-matching.
      - uses: github/codeql-action/init@v3
        with:
          languages: python
          queries: security-and-quality

      - uses: github/codeql-action/analyze@v3
        with:
          output: sarif-results
          upload: true

# ──────────────────────────────────────────────────────────────────────────────
# STAGE 3 — Dependency Scanning (Roadmap §11.1 Stage 3: <2 minutes, No CVEs, PR blocked)
# WP-004-03 | LLD v2.0 Ch. 18 §18.1 `security` job — dependency-scan portion (literal)
# ──────────────────────────────────────────────────────────────────────────────
  dependency-scan:
    name: Stage 3 — Dependency Scanning
    runs-on: ubuntu-22.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install pip-audit
        run: pip install pip-audit

      # LLD v2.0 Ch. 18 §security job — exact invocation:
      # `pip-audit --strict -r requirements.txt`
      - name: pip-audit (Python dependency CVE scan)
        run: pip-audit --strict -r templates/python-service/requirements.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pip-audit-results
          path: pip-audit-results.json

      # npm audit — documented and ready to activate; no live frontend
      # app scaffold exists in Release 1 (WP-004-03 §8 explicit scope note).
      # Activate the step below once a real frontend app scaffold exists.
      # See npm-audit-config.md for configuration details.
      # - name: npm audit (frontend/mobile dependency CVE scan)
      #   working-directory: libs/reos-config-ts
      #   run: npm ci && npm audit --audit-level=high
