services:

  # Phase 9J-S7 — HashiCorp Vault (dev mode) as the secrets store + PKI for the lab.
  # Demonstrates: KV secrets engine holding the DIEP app secrets, and a PKI engine
  # issuing per-device certs (the production replacement for the openssl CA in S4 and
  # the code-default lab secrets in S0). Production runs Vault in HA (not -dev), with
  # auto-unseal + a Vault Agent sidecar injecting secrets/certs into each service.
  vault:
    image: hashicorp/vault:latest
    container_name: diep-vault
    restart: unless-stopped
    cap_add:
      - IPC_LOCK
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: diep-root-token
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
      VAULT_ADDR: http://127.0.0.1:8200
    command: server -dev
    ports:
      - "8200:8200"
    networks:
      diep-net:
        aliases:
          - diep-vault

networks:
  diep-net:
    name: diep-lab_diep-net
    external: true
