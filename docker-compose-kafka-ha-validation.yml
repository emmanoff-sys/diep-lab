# K3 Kafka HA — side-by-side validation stack. Entirely separate from the
# production diep-kafka container/volume/topics; do not point at production
# data. Bring up with:
#   docker compose -f docker-compose-kafka-ha-validation.yml -p diep-kafka-ha-val up -d
# Tear down (including volumes) with:
#   docker compose -f docker-compose-kafka-ha-validation.yml -p diep-kafka-ha-val down -v

x-kafka-common: &kafka-common
  image: apache/kafka:latest
  restart: "no"
  networks:
    diep-net: {}
  environment: &kafka-common-env
    CLUSTER_ID: "bWSI3Ql4SdGlTSqi8cB5Nw"
    KAFKA_PROCESS_ROLES: "broker,controller"
    KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka-val-1:9093,2@kafka-val-2:9093,3@kafka-val-3:9093"
    KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
    KAFKA_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093,SASL://:9094"
    KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,SASL:SASL_PLAINTEXT"
    KAFKA_SASL_ENABLED_MECHANISMS: "PLAIN"
    KAFKA_LISTENER_NAME_SASL_PLAIN_SASL_JAAS_CONFIG: 'org.apache.kafka.common.security.plain.PlainLoginModule required username="diep" password="kafka-ha-validation-only" user_diep="kafka-ha-validation-only";'
    KAFKA_LOG_DIRS: "/var/lib/kafka/data"
    KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    KAFKA_DEFAULT_REPLICATION_FACTOR: "3"
    KAFKA_MIN_INSYNC_REPLICAS: "2"
    KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "3"
    KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "3"
    KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "2"

services:

  kafka-val-1:
    <<: *kafka-common
    container_name: diep-kafka-val-1
    hostname: kafka-val-1
    environment:
      <<: *kafka-common-env
      KAFKA_NODE_ID: "1"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka-val-1:9092,SASL://kafka-val-1:9094"
    volumes:
      - kafka-val-1-data:/var/lib/kafka/data

  kafka-val-2:
    <<: *kafka-common
    container_name: diep-kafka-val-2
    hostname: kafka-val-2
    environment:
      <<: *kafka-common-env
      KAFKA_NODE_ID: "2"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka-val-2:9092,SASL://kafka-val-2:9094"
    volumes:
      - kafka-val-2-data:/var/lib/kafka/data

  kafka-val-3:
    <<: *kafka-common
    container_name: diep-kafka-val-3
    hostname: kafka-val-3
    environment:
      <<: *kafka-common-env
      KAFKA_NODE_ID: "3"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka-val-3:9092,SASL://kafka-val-3:9094"
    volumes:
      - kafka-val-3-data:/var/lib/kafka/data

volumes:
  kafka-val-1-data:
  kafka-val-2-data:
  kafka-val-3-data:

networks:
  diep-net:
    name: diep-lab_diep-net
    external: true
