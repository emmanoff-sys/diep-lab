services:

  battery:
    image: python:3.12

    container_name: diep-battery

    restart: unless-stopped

    working_dir: /app

    volumes:
      - ./simulator:/app

    environment:
      DEVICE_ID: BAT001
      CAPACITY_KWH: "100"
      MAX_POWER_KW: "50"
      PYTHONUNBUFFERED: "1"

    command: >
      sh -c "
      pip install paho-mqtt &&
      python battery.py
      "

networks:
  default:
    name: diep-lab_diep-net
    external: true
