services:
  mqtt:
    image: eclipse-mosquitto
    container_name: diep-mqtt
    restart: unless-stopped
    ports:
      - "8883:8883"
    volumes:
      - ./mosquitto/config:/mosquitto/config
    networks:
      - diep-net

  kafka:
    image: apache/kafka:latest
    container_name: diep-kafka
    restart: unless-stopped
    ports:
      # Phase 22 SEC-4 — bound to loopback only; was 0.0.0.0 (reachable from any
      # network interface). Inter-container traffic uses the diep-net alias, not
      # this host-published port.
      - "127.0.0.1:9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # Phase 9J-S5 — additive SASL listener (9094) for app clients; 9092 PLAINTEXT
      # stays internal (inter-broker + kafka-ui). Production = SASL_SSL (Strimzi manifest).
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,SASL://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://diep-kafka:9092,SASL://diep-kafka:9094
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,SASL:SASL_PLAINTEXT
      KAFKA_SASL_ENABLED_MECHANISMS: PLAIN
      # Phase 22 SEC-2 — credential now sourced from .env (no hardcoded literal).
      KAFKA_LISTENER_NAME_SASL_PLAIN_SASL_JAAS_CONFIG: 'org.apache.kafka.common.security.plain.PlainLoginModule required username="${KAFKA_SASL_USERNAME:-diep}" password="${KAFKA_SASL_PASSWORD:?KAFKA_SASL_PASSWORD must be set in .env — see .env.example}" user_${KAFKA_SASL_USERNAME:-diep}="${KAFKA_SASL_PASSWORD:?KAFKA_SASL_PASSWORD must be set in .env — see .env.example}";'
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka-data:/var/lib/kafka/data
    networks:
      diep-net:
        aliases:
          - diep-kafka

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: diep-kafka-ui
    restart: unless-stopped
    ports:
      - "8081:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: DIEP
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: diep-kafka:9092
    depends_on:
      - kafka
    networks:
      - diep-net

  timescaledb:
    image: timescale/timescaledb:latest-pg16
    container_name: diep-timescaledb
    restart: unless-stopped
    ports:
      # Phase 22 SEC-4 — bound to loopback only (was 0.0.0.0).
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: ${DB_NAME:-diep}
      POSTGRES_USER: ${DB_USER:-diep}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-change-me-db-password}
    volumes:
      - timescale-data:/var/lib/postgresql/data
    networks:
      diep-net:
        aliases:
          - diep-timescaledb

  redis:
    image: redis:7-alpine
    container_name: diep-redis
    restart: unless-stopped
    ports:
      # Phase 22 SEC-4 — bound to loopback only (was 0.0.0.0).
      - "127.0.0.1:6379:6379"
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD} --masterauth ${REDIS_PASSWORD}
    volumes:
      - redis-data:/data
    networks:
      diep-net:
        aliases:
          - diep-redis
        ipv4_address: 172.18.0.240  # Phase 22 INFRA-2 — static IP for Sentinel's bootstrap "sentinel monitor" line (see K4_REDIS_SENTINEL_VALIDATION_REPORT.md §5: hostname-based monitoring re-entered +tilt after a container lifecycle event)

  redis-replica:
    image: redis:7-alpine
    container_name: diep-redis-replica
    restart: unless-stopped
    command: >
      redis-server
      --replicaof 172.18.0.240 6379
      --requirepass ${REDIS_PASSWORD}
      --masterauth ${REDIS_PASSWORD}
      --replica-read-only yes
      --appendonly yes
    depends_on:
      - redis
    volumes:
      - redis-replica-data:/data
    networks:
      diep-net:
        aliases:
          - diep-redis-replica
        ipv4_address: 172.18.0.241  # Phase 22 INFRA-2 — static IP, same rationale as diep-redis above

  redis-sentinel-1:
    image: redis:7-alpine
    container_name: diep-redis-sentinel-1
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    entrypoint: ["/bin/sh", "/etc/redis-sentinel/sentinel-entrypoint.sh"]
    depends_on:
      - redis
      - redis-replica
    volumes:
      - ./redis-sentinel/sentinel.conf.template:/etc/redis-sentinel/sentinel.conf.template:ro
      - ./redis-sentinel/sentinel-entrypoint.sh:/etc/redis-sentinel/sentinel-entrypoint.sh:ro
      - redis-sentinel-1-data:/data
    networks:
      - diep-net

  redis-sentinel-2:
    image: redis:7-alpine
    container_name: diep-redis-sentinel-2
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    entrypoint: ["/bin/sh", "/etc/redis-sentinel/sentinel-entrypoint.sh"]
    depends_on:
      - redis
      - redis-replica
    volumes:
      - ./redis-sentinel/sentinel.conf.template:/etc/redis-sentinel/sentinel.conf.template:ro
      - ./redis-sentinel/sentinel-entrypoint.sh:/etc/redis-sentinel/sentinel-entrypoint.sh:ro
      - redis-sentinel-2-data:/data
    networks:
      - diep-net

  redis-sentinel-3:
    image: redis:7-alpine
    container_name: diep-redis-sentinel-3
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    entrypoint: ["/bin/sh", "/etc/redis-sentinel/sentinel-entrypoint.sh"]
    depends_on:
      - redis
      - redis-replica
    volumes:
      - ./redis-sentinel/sentinel.conf.template:/etc/redis-sentinel/sentinel.conf.template:ro
      - ./redis-sentinel/sentinel-entrypoint.sh:/etc/redis-sentinel/sentinel-entrypoint.sh:ro
      - redis-sentinel-3-data:/data
    networks:
      - diep-net

  minio:
    image: minio/minio
    container_name: diep-minio
    restart: unless-stopped
    ports:
      # Phase 22 SEC-4 — bound to loopback only (was 0.0.0.0).
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9002:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      # Phase 22 SEC-6 — enables SSE-KMS; bucket-level default encryption is
      # set separately via `mc encrypt set sse-kms` (this only makes the key
      # available, it doesn't force encryption on its own).
      MINIO_KMS_SECRET_KEY: ${MINIO_KMS_SECRET_KEY}
    volumes:
      - minio-data:/data
    command: server /data --console-address ":9001"
    networks:
      diep-net:
        aliases:
          - diep-minio

  fastapi:
    image: python:3.12
    container_name: diep-fastapi
    restart: unless-stopped
    working_dir: /app
    env_file:
      - .env
    volumes:
      - ./fastapi:/app
    command: >
      sh -c "
      pip install fastapi uvicorn psycopg2-binary influxdb kafka-python redis prometheus-client &&
      uvicorn app:app --host 0.0.0.0 --port 8000
      "
    ports:
      - "8000:8000"
    depends_on:
      - timescaledb
      - influxdb
      - kafka
      - redis
    networks:
      diep-net:
        aliases:
          - diep-fastapi

  nodered:
    image: nodered/node-red
    container_name: diep-nodered
    restart: unless-stopped
    ports:
      - "1880:1880"
    volumes:
      - ./nodered:/data
    command: bash -lc "cd /data && npm install && node-red"
    depends_on:
      - mqtt
      - influxdb
      - kafka
      - fastapi
    networks:
      diep-net:
        aliases:
          - diep-nodered

  dispatcher:
    image: python:3.12
    container_name: diep-dispatcher
    restart: unless-stopped
    working_dir: /app
    env_file:
      - .env
    volumes:
      - ./dispatcher:/app
      - ./certs/devices:/certs:ro
    environment:
      KAFKA_BOOTSTRAP: diep-kafka:9094        # 9J-S5: authenticated SASL listener
      KAFKA_SECURITY_PROTOCOL: SASL_PLAINTEXT
      # Phase 22 SEC-2 — sourced from .env, no hardcoded literal.
      KAFKA_SASL_USERNAME: ${KAFKA_SASL_USERNAME:-diep}
      KAFKA_SASL_PASSWORD: ${KAFKA_SASL_PASSWORD:?KAFKA_SASL_PASSWORD must be set in .env — see .env.example}
      MQTT_BROKER: diep-mqtt
      MQTT_PORT: "8883"                        # 9J-S4: mTLS (CN=dispatcher)
      MQTT_TLS: "1"
      MQTT_CA_CERTS: /certs/ca.crt
      MQTT_CLIENT_CERT: /certs/dispatcher.crt
      MQTT_CLIENT_KEY: /certs/dispatcher.key
      MQTT_USER: ""
      MQTT_PASS: ""
      FASTAPI_BASE: http://diep-fastapi:8000
      PYTHONUNBUFFERED: "1"
    command: sh -c "pip install kafka-python paho-mqtt requests && python command_dispatcher.py"
    depends_on:
      - kafka
      - mqtt
      - fastapi
    networks:
      diep-net:
        aliases:
          - diep-dispatcher

  portal:
    image: node:20
    container_name: diep-portal
    restart: unless-stopped
    working_dir: /app
    env_file:
      - .env
    volumes:
      - ./portal:/app
    environment:
      DIEP_API_BASE: http://diep-fastapi:8000
      NEXT_PUBLIC_GRAFANA_URL: http://localhost:3001
      NEXT_TELEMETRY_DISABLED: "1"
    command: sh -c "npm install && npm run dev -- -p 3000 -H 0.0.0.0"
    ports:
      - "3002:3000"
    depends_on:
      - fastapi
    networks:
      diep-net:
        aliases:
          - diep-portal

  ingestor:
    image: python:3.12
    container_name: diep-ingestor
    restart: unless-stopped
    working_dir: /app
    env_file:
      - .env
    volumes:
      - ./ingestor:/app
      - ./certs/devices:/certs:ro
    environment:
      MQTT_BROKER: diep-mqtt
      MQTT_PORT: "8883"                        # 9J-S4: mTLS (CN=ingestor)
      MQTT_TLS: "1"
      MQTT_CA_CERTS: /certs/ca.crt
      MQTT_CLIENT_CERT: /certs/ingestor.crt
      MQTT_CLIENT_KEY: /certs/ingestor.key
      MQTT_USER: ""
      MQTT_PASS: ""
      FASTAPI_BASE: http://diep-fastapi:8000
      PYTHONUNBUFFERED: "1"
    command: sh -c "pip install paho-mqtt requests && python telemetry_ingestor.py"
    depends_on:
      - mqtt
      - fastapi
    networks:
      diep-net:
        aliases:
          - diep-ingestor

  influxdb:
    image: influxdb:1.8
    container_name: diep-influxdb
    restart: unless-stopped
    ports:
      - "8086:8086"
    environment:
      - INFLUXDB_DB=energy
    volumes:
      - influxdb-data:/var/lib/influxdb
    networks:
      diep-net:
        aliases:
          - diep-influxdb

  grafana:
    image: grafana/grafana
    container_name: diep-grafana
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Phase 21 — GF_ADMIN_PASSWORD has no default here: an unset/empty value
      # makes Compose fail the `up` loudly instead of silently running Grafana
      # on its well-known admin/admin default (see .env.example).
      GF_SECURITY_ADMIN_USER: ${GF_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_ADMIN_PASSWORD:?GF_ADMIN_PASSWORD must be set in .env — see .env.example}
    ports:
      - "3001:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
      - grafana-data:/var/lib/grafana
    depends_on:
      - influxdb
      - prometheus
    networks:
      - diep-net

  caddy:
    # Phase 22 SEC-3 — TLS reverse proxy for API, Portal, and Grafana. The
    # Caddyfile/cert seam has existed since Phase 9J-S6 but was never wired
    # into a running service until now; existing plaintext ports (8000, 3001,
    # 3002) are left untouched for internal convenience, per the Caddyfile's
    # own "existing internal clients undisturbed" design — these new ports
    # are an additional, TLS-terminated access path, not a replacement.
    image: caddy:2-alpine
    container_name: diep-caddy
    restart: unless-stopped
    ports:
      - "8082:8082"   # API HTTP -> redirects to 8443 (8080 is already diep-cadvisor's)
      - "8443:8443"   # API HTTPS
      - "3080:3080"   # Portal HTTP -> redirects to 3443
      - "3443:3443"   # Portal HTTPS
      - "3081:3081"   # Grafana HTTP -> redirects to 3444
      - "3444:3444"   # Grafana HTTPS
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy/certs:/certs:ro
    depends_on:
      - fastapi
      - portal
      - grafana
    networks:
      diep-net:
        aliases:
          - diep-caddy

  prometheus:
    image: prom/prometheus
    container_name: diep-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml
      - ./prometheus/secrets/minio_token:/etc/prometheus/secrets/minio_token:ro
      - prometheus-data:/prometheus
    depends_on:
      - node-exporter
      - alertmanager
    networks:
      - diep-net

  alertmanager:
    image: prom/alertmanager
    container_name: diep-alertmanager
    restart: unless-stopped
    env_file:
      - .env
    entrypoint: ["/bin/sh", "/etc/alertmanager-template/entrypoint.sh"]
    ports:
      - "9093:9093"
    volumes:
      - ./alertmanager/alertmanager.yml.template:/etc/alertmanager-template/alertmanager.yml.template:ro
      - ./alertmanager/entrypoint.sh:/etc/alertmanager-template/entrypoint.sh:ro
    networks:
      diep-net:
        aliases:
          - diep-alertmanager

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: diep-cadvisor
    restart: unless-stopped
    ports:
      - "8080:8080"
    privileged: true
    devices:
      - /dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:rw
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
    networks:
      - diep-net

  node-exporter:
    image: prom/node-exporter
    container_name: diep-node-exporter
    restart: unless-stopped
    ports:
      - "9100:9100"
    networks:
      diep-net:
        aliases:
          - diep-node-exporter

  # Phase 15B — TimescaleDB/Postgres metrics (connections, db size, pg_stat_statements
  # query performance, hypertable + compression stats via custom queries).
  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter
    container_name: diep-postgres-exporter
    restart: unless-stopped
    ports:
      - "9187:9187"
    environment:
      DATA_SOURCE_NAME: "postgresql://${DB_USER}:${DB_PASSWORD}@diep-timescaledb:5432/${DB_NAME}?sslmode=disable"
    volumes:
      - ./prometheus/postgres_exporter_queries.yaml:/etc/postgres_exporter/queries.yaml:ro
    command:
      - "--extend.query-path=/etc/postgres_exporter/queries.yaml"
    depends_on:
      - timescaledb
    networks:
      diep-net:
        aliases:
          - diep-postgres-exporter

  # Phase 15B — Kafka broker/topic/consumer-group metrics.
  kafka-exporter:
    image: danielqsj/kafka-exporter
    container_name: diep-kafka-exporter
    restart: unless-stopped
    ports:
      - "9308:9308"
    command:
      - "--kafka.server=diep-kafka:9092"
    depends_on:
      - kafka
    networks:
      diep-net:
        aliases:
          - diep-kafka-exporter

  # Phase 9J-S4 / DIEP remediation Phase 2: this legacy plaintext (1883) simulator is
  # superseded by the mTLS edge driver in docker-compose-meter.yml (METER001, port 8883).
  # Disabled (profile not activated by default) to avoid a ConnectionRefusedError crash loop
  # against the mTLS-only broker and a competing MQTT identity for METER001.
  smartmeter:
    image: python:3.12
    container_name: diep-smartmeter
    restart: unless-stopped
    working_dir: /app
    profiles: ["legacy-disabled"]
    volumes:
      - ./simulator:/app
    command: sh -c "pip install paho-mqtt && python smartmeter.py"
    depends_on:
      - mqtt
    networks:
      - diep-net

  # Disabled (see smartmeter comment above) — superseded by docker-compose-battery-edge.yml
  # (BAT001, mTLS 8883).
  battery:
    image: python:3.12
    container_name: diep-battery
    restart: unless-stopped
    working_dir: /app
    profiles: ["legacy-disabled"]
    volumes:
      - ./simulator:/app
    environment:
      DEVICE_ID: BAT001
      CAPACITY_KWH: "100"
      MAX_POWER_KW: "50"
      PYTHONUNBUFFERED: "1"
    command: sh -c "pip install paho-mqtt && python battery.py"
    depends_on:
      - mqtt
    networks:
      - diep-net

  # Disabled (see smartmeter comment above) — superseded by docker-compose-sunspec.yml
  # (INV001, mTLS 8883).
  solar:
    image: python:3.12
    container_name: diep-solar
    restart: unless-stopped
    working_dir: /app
    profiles: ["legacy-disabled"]
    volumes:
      - ./simulator:/app
    environment:
      DEVICE_ID: INV001
      CAPACITY_KW: "10"
      PYTHONUNBUFFERED: "1"
    command: sh -c "pip install paho-mqtt && python solar_inverter.py"
    depends_on:
      - mqtt
    networks:
      - diep-net

  # Disabled (see smartmeter comment above) — superseded by docker-compose-microgrid-edge.yml
  # (MG001, mTLS 8883).
  microgrid:
    image: python:3.12
    container_name: diep-microgrid
    restart: unless-stopped
    working_dir: /app
    profiles: ["legacy-disabled"]
    volumes:
      - ./simulator:/app
    environment:
      DEVICE_ID: MG001
      NOMINAL_FREQ: "50.0"
      DROOP_KW_PER_HZ: "20"
      PYTHONUNBUFFERED: "1"
    command: sh -c "pip install paho-mqtt && python microgrid.py"
    depends_on:
      - mqtt
    networks:
      - diep-net

  ev-charger:
    image: python:3.12
    container_name: diep-ev-charger
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./simulator:/app
      - ./certs/devices:/certs:ro
    environment:
      MQTT_BROKER: diep-mqtt
      MQTT_PORT: "8883"
      MQTT_TLS: "1"
      MQTT_CA_CERTS: /certs/ca.crt
      MQTT_CLIENT_CERT: /certs/EV001.crt
      MQTT_CLIENT_KEY: /certs/EV001.key
      MQTT_USER: ""
      MQTT_PASS: ""
      DEVICE_ID: EV001
      MAX_POWER_KW: "22"
      PYTHONUNBUFFERED: "1"
    command: sh -c "pip install paho-mqtt && python ev_charger.py"
    depends_on:
      - mqtt
    networks:
      - diep-net

volumes:
  influxdb-data:
  grafana-data:
  prometheus-data:
  kafka-data:
  timescale-data:
  redis-data:
  minio-data:
  redis-replica-data:
  redis-sentinel-1-data:
  redis-sentinel-2-data:
  redis-sentinel-3-data:

networks:
  diep-net:
    driver: bridge
    ipam:
      config:
        # Phase 22 INFRA-2 — pinned to the subnet Docker had already
        # auto-assigned, so existing containers' addresses are unaffected;
        # only diep-redis/diep-redis-replica get explicit static IPs above.
        - subnet: 172.18.0.0/16
          gateway: 172.18.0.1
