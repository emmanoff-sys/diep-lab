# DLMS/COSEM smart-meter simulator — Phase 1 (no live meters).
# Minimal stdlib DLMS subset; see drivers/dlms/protocol.py VALIDATION CAVEAT.
# Run the simulator standalone for manual/client testing:
#   docker compose -f docker-compose-dlms.yml up
services:
  dlms-sim:
    image: python:3.12-slim
    container_name: diep-dlms-sim
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./drivers:/app
    command: ["python", "-m", "dlms.sim", "--host", "0.0.0.0", "--port", "4060"]
    ports:
      - "4060:4060"
