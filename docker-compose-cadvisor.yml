services:

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: diep-cadvisor
    restart: unless-stopped

    ports:
      - "8080:8080"

    privileged: true

    devices:
      - /dev/kmsg

    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:rw
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro

networks:
  default:
    name: diep-net
    external: true
