# K6 MinIO HA — side-by-side validation stack.
# 4-node distributed MinIO with EC:2 (2 data + 2 parity shards).
# Entirely separate from diep-minio container/volume/data.
# Bring up with:
#   docker compose -f docker-compose-minio-ha-validation.yml -p diep-minio-ha-val up -d
# Tear down (including volumes) with:
#   docker compose -f docker-compose-minio-ha-validation.yml -p diep-minio-ha-val down -v

x-minio-common: &minio-common
  image: minio/minio
  restart: "no"
  networks:
    diep-net: {}
  environment:
    MINIO_ROOT_USER: minio-ha-val
    MINIO_ROOT_PASSWORD: ha-val-minio-2026
  command: >
    server
    http://minio-ha-0:9000/data
    http://minio-ha-1:9000/data
    http://minio-ha-2:9000/data
    http://minio-ha-3:9000/data
    --console-address ":9001"

services:

  minio-ha-0:
    <<: *minio-common
    container_name: diep-minio-ha-val-0
    hostname: minio-ha-0
    volumes:
      - minio-ha-0-data:/data

  minio-ha-1:
    <<: *minio-common
    container_name: diep-minio-ha-val-1
    hostname: minio-ha-1
    volumes:
      - minio-ha-1-data:/data

  minio-ha-2:
    <<: *minio-common
    container_name: diep-minio-ha-val-2
    hostname: minio-ha-2
    volumes:
      - minio-ha-2-data:/data

  minio-ha-3:
    <<: *minio-common
    container_name: diep-minio-ha-val-3
    hostname: minio-ha-3
    volumes:
      - minio-ha-3-data:/data

volumes:
  minio-ha-0-data:
  minio-ha-1-data:
  minio-ha-2-data:
  minio-ha-3-data:

networks:
  diep-net:
    name: diep-lab_diep-net
    external: true
