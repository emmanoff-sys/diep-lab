groups:
  # --- infrastructure ---
  - name: diep-infra
    rules:
      - alert: HighCPUUsage
        expr: 100 - (avg(rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 80
        for: 2m
        labels: { severity: critical }
        annotations: { summary: High CPU Usage }

      - alert: HighMemoryUsage
        expr: (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100 > 85
        for: 2m
        labels: { severity: critical }
        annotations: { summary: High Memory Usage }

      - alert: PrometheusDown
        expr: up{job="prometheus"} == 0
        for: 1m
        labels: { severity: critical }
        annotations: { summary: Prometheus Down }

      - alert: NodeExporterDown
        expr: up{job="node-exporter"} == 0
        for: 1m
        labels: { severity: critical }
        annotations: { summary: Node Exporter Down }

      - alert: CadvisorDown
        expr: up{job="cadvisor"} == 0
        for: 1m
        labels: { severity: critical }
        annotations: { summary: cAdvisor Down }

      - alert: MQTTDown
        expr: absent(container_memory_usage_bytes{name="diep-mqtt"})
        for: 1m
        labels: { severity: critical }
        annotations: { summary: MQTT Broker Down }

      - alert: GrafanaDown
        expr: absent(container_memory_usage_bytes{name="diep-grafana"})
        for: 1m
        labels: { severity: critical }
        annotations: { summary: Grafana Down }

      # --- Phase 15B: exporter-backed outage alerts ---
      - alert: KafkaOutage
        expr: up{job="kafka-exporter"} == 0 or kafka_brokers == 0
        for: 1m
        labels: { severity: critical }
        annotations:
          summary: Kafka broker unreachable
          description: kafka-exporter is down or reports zero healthy brokers.

      - alert: DatabaseOutage
        expr: up{job="postgres-exporter"} == 0 or pg_up == 0
        for: 1m
        labels: { severity: critical }
        annotations:
          summary: TimescaleDB/Postgres unreachable
          description: postgres-exporter is down or pg_up == 0 (database connection failed).

  # --- DIEP application SLOs (Phase 10C) ---
  # (Stale InfluxDB/Node-RED alerts removed — both decommissioned in 9-Data/9J.)
  - name: diep-slo
    rules:
      - alert: DiepApiDown
        expr: up{job="diep-fastapi"} == 0
        for: 1m
        labels: { severity: critical }
        annotations:
          summary: DIEP API target is down
          description: The FastAPI /metrics target is unreachable.

      - alert: HighCommandFailureRate
        expr: |
          sum(rate(diep_commands_acked_total{result="FAILED"}[10m]))
            / clamp_min(sum(rate(diep_commands_acked_total[10m])), 0.001) > 0.2
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: ">20% of device command acks are FAILED (10m window)"

      - alert: CommandsRejected
        expr: rate(diep_commands_rejected_total[5m]) > 0
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: Commands are being rejected (validation/kafka/unknown-device)

      - alert: HighCommandDispatchLatency
        expr: histogram_quantile(0.95, sum(rate(diep_command_dispatch_seconds_bucket[5m])) by (le)) > 1
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "p95 POST /commands latency > 1s"

      - alert: SlowCommandAck
        expr: histogram_quantile(0.95, sum(rate(diep_command_ack_latency_seconds_bucket[10m])) by (le)) > 30
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "p95 command->ack latency > 30s (devices slow or offline)"

  # --- ADMS Phase 2 OC-6: operational-controls safety alerts -----------------
  # Backed by the control-plane metrics on diep-fastapi /metrics (already scraped).
  # Route via the existing severity-based tree. All are inactive in the default
  # posture except by genuine operator activity.
  - name: diep-operational-controls
    rules:
      - alert: ControlActionFailed
        expr: increase(diep_control_events_total{event="FAILED"}[15m]) > 0
        for: 0m
        labels: { severity: warning }
        annotations:
          summary: A governed control action failed to execute
          description: "OC-6 — diep_control_events_total{event=FAILED} increased; an actuation raised mid-execute. Check /controls/report/readiness and the action's audit trail."

      - alert: ControlLiveExecuteBlocked
        expr: increase(diep_control_live_blocked_total[15m]) > 0
        for: 0m
        labels: { severity: warning }
        annotations:
          summary: Live control execution was refused by a governance gate
          description: "OC-6 — a live execute was blocked (flag_off or needs_approval). Expected when controls are disabled; sustained/unexpected blocks may signal a misconfiguration or an unauthorized attempt."

      - alert: OperationalControlsEnabled
        expr: diep_controls_enabled == 1
        for: 0m
        labels: { severity: warning }
        annotations:
          summary: Operational controls are ENABLED (live actuation possible)
          description: "OC-6 — OC_CONTROLS_ENABLED=true. Live actuation of switches / FLISR / DERs is possible. Informational, surfaced because it is a safety-relevant posture; resolves when the flag is turned off."

      - alert: ControlActionRolledBack
        expr: increase(diep_control_events_total{event="ROLLED_BACK"}[15m]) > 0
        for: 0m
        labels: { severity: warning }
        annotations:
          summary: A governed control action was rolled back
          description: "OC-6 — an executed action was reverted. Confirm the intended state was restored via the action's audit trail."

      - alert: ControlApprovalsBacklog
        expr: diep_control_actions{status="PENDING"} > 25
        for: 30m
        labels: { severity: warning }
        annotations:
          summary: Control-action approval backlog is high
          description: "OC-6 — more than 25 actions sitting PENDING for >30m. High-risk actions need a second approver; review the queue / readiness report."

  # --- Phase 22 MON-1..4: HA-cluster health alerts required before MW1 -------
  # These target the post-cutover production topology (K3/K2/K6/K5). Until
  # each respective maintenance window lands, the underlying metric is either
  # absent (Prometheus shows "no data", rule stays inactive — EMQX/Patroni,
  # no exporter deployed yet) or reflects the current pre-HA pilot topology
  # (Kafka: 1 broker, not yet 3) — so KafkaBrokerCountLow is EXPECTED to be
  # firing/pending until K3 (MW3) actually ships 3 brokers. That's correct,
  # not a bug: it accurately reports "fewer than the production target."
  - name: diep-ha-cluster-health
    rules:
      - alert: EMQXClusterNodesLow
        # Requires an EMQX Prometheus scrape job (target: /api/v5/prometheus/stats
        # on any EMQX node) — not yet added; EMQX itself isn't deployed until K5/MW5.
        expr: emqx_cluster_nodes_running < 3
        for: 2m
        labels: { severity: critical }
        annotations:
          summary: EMQX cluster running fewer than 3 nodes
          description: "MON-1 — routes via the existing severity-based tree (critical receiver) once data exists. No data until K5/MW5 deploys EMQX + its scrape job."

      - alert: KafkaBrokerCountLow
        # kafka-exporter is already scraped today; this WILL fire against the
        # current 1-broker pilot until K3/MW3 lands 3 brokers.
        expr: kafka_brokers < 3
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: Kafka cluster running fewer than 3 brokers
          description: "MON-2 — routes via the existing severity-based tree (warning receiver). Expected to be active pre-K3; severity intentionally 'warning' (not critical) until then to avoid paging on a known, pre-accepted state."

      - alert: MinioDiskOnlineLow
        # Scrape job added 2026-06-17 (job: minio, :9000/minio/v2/metrics/cluster,
        # bearer_token_file). Metric name corrected from the tracker's original
        # "minio_cluster_disk_online_total" — this MinIO version (2025-09 RELEASE)
        # renamed disk->drive; live-confirmed via the raw scrape that only
        # minio_cluster_drive_online_total exists. Single-node today, so this
        # correctly fires below the eventual 4-drive K6/MW2 HA target, same as
        # KafkaBrokerCountLow firing pre-K3.
        expr: minio_cluster_drive_online_total < 4
        for: 2m
        labels: { severity: critical }
        annotations:
          summary: MinIO cluster has fewer than 4 drives online
          description: "MON-3 — routes via the existing severity-based tree (critical receiver). Expected to be active pre-K6/MW2 (single node today); resolves once the 4-drive HA cluster lands."

      - alert: PatroniClusterDegraded
        # Requires a Patroni metrics exporter/sidecar translating the REST API
        # (GET :8008/cluster) into Prometheus metrics — not yet deployed;
        # K2/MW4 standup must include it alongside the Patroni cluster itself.
        expr: patroni_primary_healthy == 0 or patroni_sync_standby_count < 1
        for: 1m
        labels: { severity: critical }
        annotations:
          summary: Patroni primary unhealthy or no synchronous standby
          description: "MON-4 — routes via the existing severity-based tree (critical receiver) once data exists. No data until K2/MW4 deploys Patroni + its metrics exporter."
