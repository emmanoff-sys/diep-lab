# K2 PostgreSQL/TimescaleDB HA — side-by-side validation stack.
# Entirely separate from diep-timescaledb container/volume/data.
# Bring up with:
#   docker compose -f docker-compose-postgres-ha-validation.yml -p diep-pg-ha-val up -d
# Tear down (including volumes) with:
#   docker compose -f docker-compose-postgres-ha-validation.yml -p diep-pg-ha-val down -v

x-patroni-env: &patroni-env
  PATRONI_SCOPE: diep-pg-ha-val
  PATRONI_ETCD3_HOSTS: "pg-ha-etcd:2379"
  PATRONI_SUPERUSER_USERNAME: postgres
  PATRONI_SUPERUSER_PASSWORD: ha-val-super-2026
  PATRONI_REPLICATION_USERNAME: replicator
  PATRONI_REPLICATION_PASSWORD: ha-val-repl-2026
  PATRONI_ADMIN_USERNAME: patroni_admin
  PATRONI_ADMIN_PASSWORD: ha-val-admin-2026

services:

  pg-ha-etcd:
    image: quay.io/coreos/etcd:v3.5.16
    container_name: diep-pg-ha-etcd
    hostname: pg-ha-etcd
    restart: "no"
    networks:
      diep-net: {}
    environment:
      ETCD_NAME: etcd0
      ETCD_INITIAL_CLUSTER: "etcd0=http://pg-ha-etcd:2380"
      ETCD_INITIAL_CLUSTER_STATE: new
      ETCD_INITIAL_CLUSTER_TOKEN: diep-pg-ha-val-token
      ETCD_ADVERTISE_CLIENT_URLS: "http://pg-ha-etcd:2379"
      ETCD_LISTEN_CLIENT_URLS: "http://0.0.0.0:2379"
      ETCD_LISTEN_PEER_URLS: "http://0.0.0.0:2380"
      ETCD_INITIAL_ADVERTISE_PEER_URLS: "http://pg-ha-etcd:2380"
      ETCD_DATA_DIR: /etcd-data
    volumes:
      - pg-ha-etcd-data:/etcd-data

  pg-ha-1:
    image: timescale/timescaledb-ha:pg16
    container_name: diep-pg-ha-val-1
    hostname: pg-ha-1
    restart: "no"
    user: root
    entrypoint: ["/bin/bash", "/etc/patroni/start-patroni.sh"]
    networks:
      diep-net: {}
    environment:
      <<: *patroni-env
      PATRONI_NAME: pg-ha-1
      PATRONI_POSTGRESQL_CONNECT_ADDRESS: "pg-ha-1:5432"
      PATRONI_RESTAPI_CONNECT_ADDRESS: "pg-ha-1:8008"
    volumes:
      - pg-ha-1-data:/home/postgres/pgdata
      - pg-ha-wal-archive:/wal-archive
      - ./postgres-ha-validation/patroni/patroni-base.yml:/etc/patroni/patroni-base.yml:ro
      - ./postgres-ha-validation/start-patroni.sh:/etc/patroni/start-patroni.sh:ro
    depends_on:
      - pg-ha-etcd

  pg-ha-2:
    image: timescale/timescaledb-ha:pg16
    container_name: diep-pg-ha-val-2
    hostname: pg-ha-2
    restart: "no"
    user: root
    entrypoint: ["/bin/bash", "/etc/patroni/start-patroni.sh"]
    networks:
      diep-net: {}
    environment:
      <<: *patroni-env
      PATRONI_NAME: pg-ha-2
      PATRONI_POSTGRESQL_CONNECT_ADDRESS: "pg-ha-2:5432"
      PATRONI_RESTAPI_CONNECT_ADDRESS: "pg-ha-2:8008"
    volumes:
      - pg-ha-2-data:/home/postgres/pgdata
      - pg-ha-wal-archive:/wal-archive
      - ./postgres-ha-validation/patroni/patroni-base.yml:/etc/patroni/patroni-base.yml:ro
      - ./postgres-ha-validation/start-patroni.sh:/etc/patroni/start-patroni.sh:ro
    depends_on:
      - pg-ha-etcd

  pg-ha-3:
    image: timescale/timescaledb-ha:pg16
    container_name: diep-pg-ha-val-3
    hostname: pg-ha-3
    restart: "no"
    user: root
    entrypoint: ["/bin/bash", "/etc/patroni/start-patroni.sh"]
    networks:
      diep-net: {}
    environment:
      <<: *patroni-env
      PATRONI_NAME: pg-ha-3
      PATRONI_POSTGRESQL_CONNECT_ADDRESS: "pg-ha-3:5432"
      PATRONI_RESTAPI_CONNECT_ADDRESS: "pg-ha-3:8008"
    volumes:
      - pg-ha-3-data:/home/postgres/pgdata
      - pg-ha-wal-archive:/wal-archive
      - ./postgres-ha-validation/patroni/patroni-base.yml:/etc/patroni/patroni-base.yml:ro
      - ./postgres-ha-validation/start-patroni.sh:/etc/patroni/start-patroni.sh:ro
    depends_on:
      - pg-ha-etcd

  pg-ha-haproxy:
    image: haproxy:alpine
    container_name: diep-pg-ha-haproxy
    hostname: pg-ha-haproxy
    restart: "no"
    networks:
      diep-net: {}
    volumes:
      - ./postgres-ha-validation/haproxy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    depends_on:
      - pg-ha-1
      - pg-ha-2
      - pg-ha-3

volumes:
  pg-ha-etcd-data:
  pg-ha-1-data:
  pg-ha-2-data:
  pg-ha-3-data:
  pg-ha-wal-archive:

networks:
  diep-net:
    name: diep-lab_diep-net
    external: true
