---
# prometheus-node role — Node Exporter for VM-level metrics (LLD v2.0 §17.1)

- name: Create prometheus system user
  ansible.builtin.user:
    name: node_exporter
    system: true
    shell: /usr/sbin/nologin
    create_home: false

- name: Download and install Node Exporter
  ansible.builtin.unarchive:
    src: >-
      https://github.com/prometheus/node_exporter/releases/download/v{{ node_exporter_version | default('1.8.1') }}/node_exporter-{{ node_exporter_version | default('1.8.1') }}.linux-amd64.tar.gz
    dest: /tmp
    remote_src: true

- name: Install node_exporter binary
  ansible.builtin.copy:
    src: >-
      /tmp/node_exporter-{{ node_exporter_version | default('1.8.1') }}.linux-amd64/node_exporter
    dest: /usr/local/bin/node_exporter
    remote_src: true
    mode: "0755"
    owner: node_exporter
    group: node_exporter

- name: Install node_exporter systemd unit
  ansible.builtin.copy:
    dest: /etc/systemd/system/node_exporter.service
    content: |
      [Unit]
      Description=Prometheus Node Exporter
      After=network-online.target

      [Service]
      User=node_exporter
      ExecStart=/usr/local/bin/node_exporter --web.listen-address=127.0.0.1:9100

      [Install]
      WantedBy=multi-user.target
    mode: "0644"
  notify: Reload systemd and restart node_exporter

- name: UFW — allow node_exporter from localhost only (Prometheus scrapes via SSH tunnel or Consul-discovered internal route)
  community.general.ufw:
    rule: allow
    port: "9100"
    proto: tcp
    src: "127.0.0.1"
    comment: "Node Exporter — localhost scrape"
