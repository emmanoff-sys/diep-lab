---
# docker role — Docker CE install, no swarm mode (LLD v2.0 §17.1)
# Explicit negative: no orchestration layer of any kind, confirming ECR-001.

- name: Install Docker CE prerequisites
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - gnupg
    state: present
    update_cache: true

- name: Add Docker's official GPG key
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/ubuntu/gpg
    dest: /etc/apt/keyrings/docker.asc
    mode: "0644"

- name: Add Docker apt repository
  ansible.builtin.apt_repository:
    repo: >-
      deb [arch={{ ansible_architecture }} signed-by=/etc/apt/keyrings/docker.asc]
      https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable
    state: present

- name: Install Docker CE
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-compose-plugin
    state: present
    update_cache: true

- name: Enable and start Docker daemon
  ansible.builtin.systemd:
    name: docker
    enabled: true
    state: started

- name: Add reos user to the docker group
  ansible.builtin.user:
    name: reos
    groups: docker
    append: true

- name: Create the shared reos-vm-net Docker network
  community.docker.docker_network:
    name: reos-vm-net
    state: present

# Explicit negative confirmation — no orchestration layer (ECR-001).
# `docker swarm init` is never called anywhere in this role; Docker Swarm
# mode ships disabled by default and must remain so.
- name: Confirm Swarm mode is inactive
  ansible.builtin.command: docker info --format '{{ "{{" }}.Swarm.LocalNodeState{{ "}}" }}'
  register: swarm_state
  changed_when: false
  failed_when: swarm_state.stdout != "inactive"
