# DAEP / RE-OS — HAProxy TCP load balancer (WP-003-09)
#
# FLAGGED (WP-003-09 §9/§15/§35, not an LLD-literal excerpt): LLD v2.0 Ch. 17
# introduction confirms HAProxy's role ("HAProxy handles TCP (Kafka, MQTT)")
# but the captured LLD excerpt did not include a worked HAProxy config
# example (unlike Nginx and Keepalived, both of which ARE literal LLD
# excerpts — see nginx.conf/keepalived.conf headers). This file is built
# from standard HAProxy TCP-mode practice. Re-verify against the complete
# LLD v2.0 document if/when more of it becomes available beyond this
# package's initial document-reconciliation extraction (§39).

global
    log stdout format raw local0
    maxconn 4096

defaults
    mode tcp
    timeout connect 5s
    timeout client  60s
    timeout server  60s
    log global

# --- Kafka (port 9092) -----------------------------------------------------
frontend kafka_frontend
    bind *:9092
    default_backend kafka_backend

backend kafka_backend
    balance leastconn
    option tcp-check
    server kafka1 10.0.2.10:9092 check inter 5s fall 3 rise 2
    server kafka2 10.0.2.11:9092 check inter 5s fall 3 rise 2

# --- MQTT (port 1883) -------------------------------------------------------
frontend mqtt_frontend
    bind *:1883
    default_backend mqtt_backend

backend mqtt_backend
    balance leastconn
    option tcp-check
    server mqtt1 10.0.2.20:1883 check inter 5s fall 3 rise 2
    server mqtt2 10.0.2.21:1883 check inter 5s fall 3 rise 2

# --- Stats (internal only) --------------------------------------------------
listen stats
    bind 127.0.0.1:8404
    mode http
    stats enable
    stats uri /stats
    stats refresh 10s
