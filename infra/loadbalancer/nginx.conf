# DAEP / RE-OS — Nginx HTTP load balancer (WP-003-09)
# Authority: LLD v2.0 §17.2 (direct, literal source) | Ch. 17 introduction
# ("Nginx handles HTTP load balancing")

user www-data;
worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    # Rate-limit zones — tighter on auth than general API traffic (§25,
    # matching the LLD's exact differentiation).
    limit_req_zone $binary_remote_addr zone=auth_strict:10m rate=5r/s;
    limit_req_zone $binary_remote_addr zone=api_standard:10m rate=50r/s;

    # X-Request-ID propagation — ties Nginx access logs to backend
    # structured logs via reos-logging's request-ID contextvars (WP-002-03).
    map $http_x_request_id $request_id_final {
        default   $http_x_request_id;
        ""        $request_id;
    }

    upstream reos_scaffold {
        least_conn;
        server 10.0.1.10:8000 max_fails=3 fail_timeout=30s;
        server 10.0.1.11:8000 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name api.reos.internal;

        ssl_protocols TLSv1.3;
        ssl_certificate     /etc/nginx/ssl/reos.crt;   # self-signed for Release 1 scaffold validation (§24)
        ssl_certificate_key /etc/nginx/ssl/reos.key;

        # Security headers (§25 — mandatory on every response).
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;

        add_header X-Request-ID $request_id_final always;

        # Rate limit: HTTP 429 on breach — matches DRDP v1.0 §21.3's
        # documented UI behavior exactly.
        limit_req_status 429;

        location /api/v1/auth/ {
            limit_req zone=auth_strict burst=10 nodelay;
            proxy_pass http://reos_scaffold;
            proxy_set_header X-Request-ID $request_id_final;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location / {
            limit_req zone=api_standard burst=200 nodelay;
            proxy_pass http://reos_scaffold;
            proxy_set_header X-Request-ID $request_id_final;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /health {
            # Consumed by Keepalived's vrrp_script (keepalived.conf).
            proxy_pass http://reos_scaffold;
            access_log off;
        }

        # Basic connection metrics for prometheus-node (WP-003-07 §27).
        location /nginx_status {
            stub_status;
            allow 127.0.0.1;
            deny all;
        }
    }
}
