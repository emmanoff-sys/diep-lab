# DAEP / RE-OS — Keepalived VRRP failover, BACKUP node (WP-003-09)
# Companion to keepalived.conf (MASTER) — deployed to the second LB VM.
# Identical vrrp_script/virtual_ipaddress/virtual_router_id/auth_pass;
# only `state` and `priority` differ, per standard VRRP primary/backup
# pairing.

vrrp_script chk_nginx {
    script "/usr/bin/curl -sf http://localhost/health -o /dev/null"
    interval 2
    weight   -20
    fall     3
    rise     2
}

vrrp_instance REOS_LB {
    state BACKUP
    interface eth0
    virtual_router_id 51
    priority 100
    advert_int 1

    authentication {
        auth_type PASS
        auth_pass "PLACEHOLDER-pending-WP-003-13-vault-integration"
    }

    virtual_ipaddress {
        10.0.1.100/24
    }

    track_script {
        chk_nginx
    }
}
