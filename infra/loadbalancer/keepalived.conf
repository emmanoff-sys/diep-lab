# DAEP / RE-OS — Keepalived VRRP failover (WP-003-09)
# Authority: LLD v2.0 §17.2 (direct, literal source) | Ch. 17 introduction
# ("Keepalived provides VRRP virtual IP failover for Nginx")

vrrp_script chk_nginx {
    script "/usr/bin/curl -sf http://localhost/health -o /dev/null"
    interval 2
    weight   -20
    fall     3
    rise     2
}

# --- Primary LB node -----------------------------------------------------
vrrp_instance REOS_LB {
    state MASTER
    interface eth0
    virtual_router_id 51
    priority 150
    advert_int 1

    authentication {
        auth_type PASS
        # Placeholder for this WP's own testing — sourced from Vault once
        # WP-003-13 exists (§24, explicitly flagged rather than silently
        # treated as production-ready).
        auth_pass "PLACEHOLDER-pending-WP-003-13-vault-integration"
    }

    virtual_ipaddress {
        10.0.1.100/24
    }

    track_script {
        chk_nginx
    }
}
