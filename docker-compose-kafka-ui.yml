services:

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: diep-kafka-ui
    restart: unless-stopped

    ports:
      - "8081:8080"

    environment:
      KAFKA_CLUSTERS_0_NAME: DIEP
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: diep-kafka:9092

networks:
  default:
    name: diep-net
    external: true
