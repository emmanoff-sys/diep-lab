[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "service-name"
version = "0.1.0"
description = "DAEP / RE-OS service — rename 'service-name' throughout before use"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic-settings>=2.3.0",
    # Shared platform libraries (EPIC-002) — internal index, ARTIFACT_REPOSITORY.md
    "reos-config>=0.1.0",
    "reos-logging>=0.1.0",
    "reos-exceptions>=0.1.0",
    "reos-common>=0.1.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
    "asyncpg>=0.29.0",
    "structlog>=24.1.0",
    "python-jose[cryptography]>=3.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "testcontainers[postgres]>=4.7.0",
    "httpx>=0.27.0",
    "mypy>=1.10.0",
    "ruff>=0.4.0",
    "black>=24.0.0",
    "isort>=5.13.0",
    "bandit[toml]>=1.7.9",
    "types-python-jose>=3.3.4",
    "sqlalchemy[mypy]>=2.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/service_name"]

[tool.black]
line-length = 100
target-version = ["py311"]

# [tool.isort] intentionally absent: isort resolves the NEAREST config per
# file, so a section here shadows the root pyproject.toml and makes
# single-file and directory-walk invocations disagree on first-party
# classification (caused the PR #20-#22 Stage 1 chain). Root config governs.

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "C90", "N", "UP", "B", "S"]
ignore = ["S101"]

[tool.mypy]
strict = true
python_version = "3.11"
plugins = ["pydantic.mypy", "sqlalchemy.ext.mypy.plugin"]

[[tool.mypy.overrides]]
module = ["aiokafka.*", "jose.*"]
ignore_missing_imports = true

[tool.bandit]
skips = ["B101"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
